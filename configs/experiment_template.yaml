# PAPER GRID (Section 6, Table 2). Run on the Mac Studio after:
#   1) ns-3.44 Python bindings are installed (docs/mac_studio_experiment_guide.md),
#   2) real LLM-agent traces exist in data.root (swarmleak gen-traces --config this-file).
# Nothing here downloads data.
experiment:
  name: paper_grid
  output_dir: outputs/paper_grid
  seed: 2026
  backend: ns3
  jobs: 8                   # adjust to Mac Studio cores / memory (AODV any-hop runs need ~4 GB each)

data:
  trace_source: llm
  root: data/traces         # relative to the working directory; place or generate traces here
  pattern: "llm_n{n}_m{mission}.json"

llm:
  endpoint: null            # e.g. http://localhost:11434/v1 ; set before gen-traces
  model: null               # record the exact model tag and quantisation in the paper
  temperature: 0.7
  max_tokens: 400
  latency_scale: 0.2
  report_llm_prob: 1.0

scenario: {n: 20, duration: 600, speed: 15, area: 800, mobility: gm, monitors: quad, routing: olsr}

grid:
  # E1 / E3 (OLSR, N = 20, Gauss-Markov, 4 monitors), 12 missions
  - {defense: none, n_missions: 12}
  - {defense: pad, n_missions: 12}
  - {defense: rot, n_missions: 12}
  - {defense: cover_uniform, budgets: [0.2, 1.0], n_missions: 12}
  - {defense: cover_targeted, budgets: [0.2, 1.0], n_missions: 12}
  - {defense: full, budgets: [0.05, 0.2, 1.0], n_missions: 12}
  - {defense: const, budgets: [0.2, 1.0], n_missions: 12}
  - {defense: full_anyhop, budgets: [0.2], n_missions: 12}
  # E1 / E4 under AODV
  - {defense: none, n_missions: 12, scenario: {routing: aodv}}
  - {defense: full, budgets: [0.2], n_missions: 12, scenario: {routing: aodv}}
  - {defense: full_anyhop, budgets: [0.2], n_missions: 12, scenario: {routing: aodv}}
  # group mobility and a single edge monitor
  - {defense: none, n_missions: 12, scenario: {mobility: rpgm}}
  - {defense: full, budgets: [0.2], n_missions: 12, scenario: {mobility: rpgm}}
  - {defense: none, n_missions: 12, scenario: {monitors: edge}}
  - {defense: full, budgets: [0.2], n_missions: 12, scenario: {monitors: edge}}
  # E2: size and speed, 6 missions
  - {defense: none, n_missions: 6, scenario: {n: 10}}
  - {defense: full, budgets: [0.2], n_missions: 6, scenario: {n: 10}}
  - {defense: none, n_missions: 6, scenario: {n: 30}}
  - {defense: full, budgets: [0.2], n_missions: 6, scenario: {n: 30}}
  - {defense: none, n_missions: 6, scenario: {speed: 5}}
  - {defense: full, budgets: [0.2], n_missions: 6, scenario: {speed: 5}}
  - {defense: none, n_missions: 6, scenario: {speed: 25}}
  - {defense: full, budgets: [0.2], n_missions: 6, scenario: {speed: 25}}

evaluation:
  bootstrap: 10000
  comparisons:   # paired by mission (Section 6, Statistics)
    - {a: full_b0.2_olsr_n20_v15_gm_quad, b: cover_uniform_b0.2_olsr_n20_v15_gm_quad, metric: plan_f1}
    - {a: full_b0.2_olsr_n20_v15_gm_quad, b: const_b0.2_olsr_n20_v15_gm_quad, metric: role_acc_h30}
    - {a: full_b0.2_olsr_n20_v15_gm_quad, b: const_b0.2_olsr_n20_v15_gm_quad, metric: phase_acc}
    - {a: full_b0.2_olsr_n20_v15_gm_quad, b: rot_b0_olsr_n20_v15_gm_quad, metric: role_acc_h30}
    - {a: full_b0.2_olsr_n20_v15_gm_quad, b: none_b0_olsr_n20_v15_gm_quad, metric: pdr}
